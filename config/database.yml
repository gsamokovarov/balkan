default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: db/development/data.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: db/test/data.sqlite3

# The db/production directory is mounted as a persistent Docker volume by hamal.
production:
  primary:
    <<: *default
    database: db/production/data.sqlite3
  queue:
    <<: *default
    database: db/production/queue.sqlite3
    migrations_paths: db/queue_migrate
